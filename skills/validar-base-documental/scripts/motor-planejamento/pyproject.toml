[project]
name = "fiscal-document-intake"
version = "0.1.0"
description = "Validador local dos UC-001 e UC-002 para conteúdo fiscal."
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7.1,<0.8",
  "openpyxl>=3.1,<4",
  "pypdf>=6,<7"
]

[project.scripts]
fiscal-document-intake = "fiscal_document_intake.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "reportlab>=4,<5",
  "ruff>=0.12,<1"
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiscal_document_intake"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.uv]
default-groups = []
